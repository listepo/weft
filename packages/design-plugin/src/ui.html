<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Weft</title>
    <style>
      body {
        margin: 0;
        padding: 12px;
        font:
          12px/1.4 Inter,
          system-ui,
          sans-serif;
        color: var(--figma-color-text, #222);
        background: var(--figma-color-bg, #fff);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      textarea {
        width: 100%;
        box-sizing: border-box;
        min-height: 160px;
        font:
          11px/1.4 ui-monospace,
          monospace;
        color: inherit;
        background: var(--figma-color-bg-secondary, #f5f5f5);
        border: 1px solid var(--figma-color-border, #ddd);
        border-radius: 4px;
        padding: 6px;
      }
      textarea.small {
        min-height: 80px;
      }
      .row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      button {
        font: inherit;
        padding: 4px 10px;
      }
      #notes li {
        margin-bottom: 2px;
      }
    </style>
  </head>
  <body>
    <strong>Weft → {{tool}}</strong>
    <div class="row">
      <input id="file" type="file" accept=".weft,text/plain" />
    </div>
    <textarea id="source" placeholder="Paste a .weft screen" spellcheck="false"></textarea>
    <strong>Token modes (optional)</strong>
    <div class="row">
      <input id="resolver-file" type="file" accept=".json,application/json" />
    </div>
    <textarea
      id="resolver"
      class="small"
      placeholder="Paste a DTCG resolver document with its sets inline"
      spellcheck="false"
    ></textarea>
    <div class="row">
      <button id="load-resolver">Load resolver</button>
      <label
        >Modes from
        <select id="modifier"></select
      ></label>
    </div>
    <div class="row"><button id="build">Build {{layer}}s</button></div>
    <strong>{{tool}} → Weft</strong>
    <div class="row">
      <button id="export">Export selected {{layer}}</button>
      <button id="copy" disabled>Copy</button>
      <button id="download" disabled>Download</button>
    </div>
    <textarea id="result" readonly spellcheck="false"></textarea>
    <strong>Token modes of the file</strong>
    <textarea id="resolver-out" class="small" readonly spellcheck="false"></textarea>
    <div class="row">
      <button id="download-resolver" disabled>Download tokens.resolver.json</button>
    </div>
    <div id="status" role="status"></div>
    <ul id="notes"></ul>
    <!-- The build puts the bundled UI entry here as a module script (src/build.ts). -->
    <!-- weft:script -->
  </body>
</html>
