# The workspace root: checks that cover every package at once.
id: 'root'
language: 'typescript'

workspace:
  inheritedTasks:
    exclude: ['test']

tasks:
  typecheck:
    command: 'tsc --noEmit -p .'
    inputs: ['/packages/**/*', '/plugins/**/*', '/bench/**/*', '/tsconfig.json']
  lint:
    script: 'oxlint --deny-warnings . && oxfmt --check "**/*.{ts,tsx,json}"'
    inputs: ['/packages/**/*', '/plugins/**/*', '/bench/**/*', '/compat/**/*', '/*.json', '/.claude-plugin/*.json']
  fmt:
    command: 'oxfmt "**/*.{ts,tsx,json}"'
    options:
      cache: false
      runInCI: false
  # The Rust core and CLI. The differential fixture ties these to the TypeScript core's results.
  rust-test:
    command: 'cargo nextest run --workspace'
    # weft-catalog embeds catalog.json and its tests read the examples and default tokens.
    inputs: ['/crates/**/*', '/Cargo.toml', '/Cargo.lock', '/packages/catalog/catalog.json', '/packages/catalog/examples/**/*', '/packages/catalog/tokens/**/*']
  rust-lint:
    script: 'cargo clippy --workspace --all-targets -- -D warnings && cargo fmt --all --check'
    inputs: ['/crates/**/*', '/Cargo.toml', '/Cargo.lock', '/clippy.toml']
