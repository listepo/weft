# The workspace root: checks that cover every package at once.
id: "root"
language: "typescript"

workspace:
  inheritedTasks:
    exclude: ["test"]

fileGroups:
  # What the binding suites read: the packages' sources and tests, the generated module they load,
  # and the corpus, specification and fixtures the differential suites compare against.
  runtime-suites:
    - "/runtimes/**/*"
    - "/packages/**/*"
    - "!/packages/**/node_modules/**"
    - "/pnpm-lock.yaml"
    - "/corpus/**/*"
    - "/examples/**/*"
    - "/schemas/**/*"
    - "/compat/**/*"
    - "/SPEC.md"
    - "/AGENT-SPEC.md"
    - "/crates/*/tests/fixtures/**/*"
  # The workspace crates both Rust builds are made of (`rust-shared`, plus the crate of each task), and the files they read from outside their own
  # folders (`include_str!` of the catalog and the default tokens). Compared with `cargo metadata` and
  # with the includes in the sources by tooling/test/inputs.test.ts, which fails when a dependency or
  # an include is added without updating them: a missing entry would serve a stale cached build.
  # The `wasm` task builds weft-wasm with and without its `web` feature.
  rust-shared:
    - "/Cargo.toml"
    - "/Cargo.lock"
    - "/packages/catalog/catalog.json"
    - "/packages/catalog/tokens/default.tokens.json"
    - "/crates/weft-binding/**/*"
    - "/crates/weft-catalog/**/*"
    - "/crates/weft-core/**/*"
    - "/crates/weft-import/**/*"
    - "/crates/weft-web/**/*"
  wasm-crate:
    - "/crates/weft-wasm/**/*"
  native-crate:
    - "/crates/weft-node/**/*"

tasks:
  # The Rust core compiled to WebAssembly for @weft/core and @weft/catalog. Generated and
  # gitignored: the module must always match the crates it came from.
  wasm:
    # The remaps keep the builder's home directory, user name and checkout path out of the module
    # (cargo registry sources, the toolchain and this workspace appear in its panic messages), so
    # the same sources build to the same bytes on any machine. A script, not a command, for the
    # shell variables; the remap is passed to rustc by this task only, not by a global cargo config.
    # Two modules: the core alone (`@weft/core`), and the core with the web importers and
    # generators (`@weft/core/web`), so core-only pages do not download the HTML and JSX parsers.
    script: 'export RUSTFLAGS="--remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo --remap-path-prefix=${RUSTUP_HOME:-$HOME/.rustup}=/rustup --remap-path-prefix=$(pwd -P)=/weft" && wasm-pack build crates/weft-wasm --release --target web --no-pack --out-dir ../../packages/core/wasm --out-name weft && wasm-pack build crates/weft-wasm --release --target web --no-pack --out-dir ../../packages/core/wasm-web --out-name weft -- --features web'
    inputs: ["@group(rust-shared)", "@group(wasm-crate)"]
    outputs: ["/packages/core/wasm/**/*", "/packages/core/wasm-web/**/*"]
  # The native addon of the same Rust core (crates/weft-node) for Node and Bun, built for the host
  # into the gitignored packages/core/native/. `@weft/core` picks it at load time and uses the
  # WebAssembly module where there is none. The prebuilt list in packages/core/package.json
  # (arm64 macOS, x64 and arm64 glibc Linux, x64 Windows) is built per target by the release job,
  # not here. Intel macOS is not supported.
  native:
    command: "napi build --platform --release --no-js --cwd packages/core --manifest-path ../../crates/weft-node/Cargo.toml -p weft-node --output-dir native"
    inputs: ["@group(rust-shared)", "@group(native-crate)", "/packages/core/package.json"]
    outputs: ["/packages/core/native/**/*"]
  # The `weft` CLI, which @weft/visual runs for the targets that exist only in Rust. Its own
  # target directory: rust-test builds `target/debug/weft` with every feature, and running in
  # parallel it would replace the binary while the visual suite calls it. Not cached: cargo
  # already skips an up-to-date build, and a cached run would not notice a deleted binary.
  cli:
    command: "cargo build -p weft-cli --target-dir target/visual"
    options:
      cache: false
  # The @weft/core and @weft/catalog suites on Node, Deno, Bun and headless Chromium, which are the
  # runtimes the WebAssembly module ships to, plus Node and Bun again on the native addon. One Vitest
  # config (runtimes/vitest.config.ts) for all six legs; they run in parallel and the task passes when
  # every leg does. It belongs in `moon ci`: the legs cost seconds beyond `:test`, mise already pins
  # Deno and Bun for CI, and a regression that only one runtime shows (a missing API, a different
  # module loader) reaches nothing else. `WEFT_ENGINE` is set on every leg, because under the default
  # `auto` a built addon would silently take over the Node and Bun legs and the module would no
  # longer be tested there. Deno and the browser have no addon, so they stay on WebAssembly. A native
  # leg fails when the addon did not load (engines.test.ts), so it cannot pass on the fallback.
  runtimes:
    command: "noop"
    deps:
      [
        "root:runtimes-node",
        "root:runtimes-node-native",
        "root:runtimes-deno",
        "root:runtimes-bun",
        "root:runtimes-bun-native",
        "root:runtimes-browser",
      ]
  # The WebAssembly legs depend on the addon too: engines.test.ts loads it on every leg and compares
  # its surface with the module, so a stale addon would fail them after a change to the Rust core.
  runtimes-node:
    command: "vitest run --config runtimes/vitest.config.ts"
    env:
      WEFT_RUNTIME: "node"
      WEFT_ENGINE: "wasm"
    deps: ["root:wasm", "root:native"]
    inputs: ["@group(runtime-suites)"]
  runtimes-node-native:
    command: "vitest run --config runtimes/vitest.config.ts"
    env:
      WEFT_RUNTIME: "node"
      WEFT_ENGINE: "native"
    deps: ["root:wasm", "root:native"]
    inputs: ["@group(runtime-suites)"]
  # Deno and Bun run Vitest's own entry point, so the leg exercises the same test files and runner
  # as Node. `--node-modules-dir=manual` makes Deno use the pnpm-installed node_modules; `--bun` makes
  # Bun also run the worker processes Vitest spawns, which would otherwise start `node`.
  runtimes-deno:
    script: "deno --version | head -1 && deno run -A --node-modules-dir=manual node_modules/vitest/vitest.mjs run --config runtimes/vitest.config.ts"
    env:
      WEFT_RUNTIME: "deno"
      WEFT_ENGINE: "wasm"
    deps: ["root:wasm"]
    inputs: ["@group(runtime-suites)"]
  runtimes-bun:
    script: 'echo "bun $(bun --version)" && bun --bun node_modules/vitest/vitest.mjs run --config runtimes/vitest.config.ts'
    env:
      WEFT_RUNTIME: "bun"
      WEFT_ENGINE: "wasm"
    deps: ["root:wasm", "root:native"]
    inputs: ["@group(runtime-suites)"]
  runtimes-bun-native:
    script: 'echo "bun $(bun --version)" && bun --bun node_modules/vitest/vitest.mjs run --config runtimes/vitest.config.ts'
    env:
      WEFT_RUNTIME: "bun"
      WEFT_ENGINE: "native"
    deps: ["root:wasm", "root:native"]
    inputs: ["@group(runtime-suites)"]
  runtimes-browser:
    command: "vitest run --config runtimes/vitest.config.ts"
    env:
      WEFT_RUNTIME: "browser"
      WEFT_ENGINE: "wasm"
    deps: ["root:wasm"]
    inputs: ["@group(runtime-suites)"]
  typecheck:
    command: "tsc --noEmit -p ."
    deps: ["root:wasm"]
    inputs:
      [
        "/packages/**/*",
        "/plugins/**/*",
        "/bench/**/*",
        "/runtimes/**/*",
        "/tooling/**/*",
        "/tsconfig.json",
      ]
  lint:
    script: "oxlint --deny-warnings --ignore-pattern 'plugins/*/dist/**' . && oxfmt --check '**/*.{ts,tsx,json}'"
    inputs:
      [
        "/packages/**/*",
        "/plugins/**/*",
        "/bench/**/*",
        "/runtimes/**/*",
        "/tooling/**/*",
        "/compat/**/*",
        "/*.json",
        "/.claude-plugin/*.json",
      ]
  # The iteration loop: the checks the changed files affect (tooling/changed.ts). Not a check of its
  # own, so it is neither cached nor part of `moon ci`; the full check stays the merge gate.
  changed:
    command: "node tooling/changed.ts"
    options:
      cache: false
      runInCI: false
  fmt:
    command: 'oxfmt "**/*.{ts,tsx,json}"'
    options:
      cache: false
      runInCI: false
  # The Rust core and CLI. The differential fixtures, written by the former TypeScript core, pin
  # their results; the TypeScript suites check that the WebAssembly build still reproduces them.
  rust-test:
    command: "cargo nextest run --workspace --all-features"
    # weft-catalog embeds catalog.json and its tests read the examples and default tokens; the
    # CLI tests read the example project; the schema test checks schemas/weft.schema.json;
    # weft-swiftui generates and reads back every corpus screen.
    inputs:
      [
        "/crates/**/*",
        "/Cargo.toml",
        "/Cargo.lock",
        "/packages/catalog/catalog.json",
        "/packages/catalog/examples/**/*",
        "/packages/catalog/tokens/**/*",
        "/examples/**/*",
        "/schemas/**/*",
        "/corpus/**/*",
      ]
  rust-lint:
    script: "cargo clippy --workspace --all-targets --all-features -- -D warnings && cargo fmt --all --check"
    inputs: ["/crates/**/*", "/Cargo.toml", "/Cargo.lock", "/clippy.toml"]
