[workspace]
members = ["crates/*"]
default-members = ["crates/weft-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
weft-binding = { path = "crates/weft-binding" }
weft-core = { path = "crates/weft-core" }
weft-catalog = { path = "crates/weft-catalog" }
weft-import = { path = "crates/weft-import" }
weft-interop = { path = "crates/weft-interop" }
weft-slint = { path = "crates/weft-slint" }
weft-swiftui = { path = "crates/weft-swiftui" }
weft-web = { path = "crates/weft-web" }
# weft-core
indexmap = { version = "2.14.2", features = ["serde"] }
# JavaScript's number-to-string rules, so canonical JSON and messages match the TypeScript core.
ryu-js = "1.0.3"
serde = { version = "1.0.229", features = ["derive"] }
# preserve_order keeps object keys in input order, as JavaScript objects do; float_roundtrip
# parses numbers exactly as JSON.parse does; unbounded_depth admits documents nested 256 deep.
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }
thiserror = "2.0.21"
# weft-import: the NFKD step of id slugs, as `String.prototype.normalize("NFKD")` does it.
unicode-normalization = "0.1.25"
# weft-web: the WHATWG HTML parser, so imported pages are read as a browser builds them.
html5ever = "0.40.1"
# weft-web: Unicode letter and number classes, as the `\p{L}`/`\p{N}` of the generators' JSX text checks.
unicode-properties = { version = "0.1.4", default-features = false, features = ["general-category"] }
# weft-web: the JSX and TSX parser of the React and Solid importers (pure Rust, builds for wasm32).
# Without default features: the importers never look inside regular expression literals.
oxc_allocator = "0.152.0"
oxc_ast = "0.152.0"
oxc_parser = { version = "0.152.0", default-features = false }
oxc_span = "0.152.0"
# tests: weft-core, weft-catalog
proptest = "1.11.0"
# tests: weft-snapshots, reviewed per-target output snapshots.
insta = "1.49.0"
# tests: weft-snapshots, the A2UI JSON Schemas the exported messages are checked against (no network or TLS).
jsonschema = { version = "0.58.5", default-features = false }
# weft-cli
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
# weft-swiftui: the Swift grammar for the importer (`import` feature); C sources built by cc.
tree-sitter = "0.27.0"
tree-sitter-swift = "0.7.4"
# tests: weft-slint, compiles the generated `.slint` files. Without default features: no backend or
# renderer, only the compiler; `compat-1-18` is the feature set the crate requires.
slint-interpreter = { version = "1.18.1", default-features = false, features = ["compat-1-18", "std"] }
# tests: weft-slint screenshots. The testing backend's software renderer draws without a window.
i-slint-backend-testing = { version = "1.18.1", default-features = false, features = ["renderer-software"] }
i-slint-core = { version = "1.18.1", default-features = false }
# tests: weft-slint screenshots. PNG encode and decode of the rendered frames; the `image` stack
# is more than this needs.
png = "0.18.1"
# weft-slint: the syntax tree for the importer (`import` feature). Same 1.18 line, no renderer
# and no backend (the crate's default features are empty).
i-slint-compiler = { version = "1.18.1", default-features = false }
# weft-wasm. Exact: the generated glue only loads with the wasm-bindgen CLI of the same version,
# which mise pins.
wasm-bindgen = "=0.2.129"

# weft-node: the native addon for Node and Bun. Latest stable of each, checked on crates.io on
# 2026-10-05; napi-derive and napi-build are the macro and build-script halves of napi.
napi = { version = "3.14.1", default-features = false, features = ["napi8"] }
napi-derive = "3.6.11"
napi-build = "2.6.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
