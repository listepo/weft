# Inherited by every project; the root opts out in its moon.yml. Tests read sibling packages, the corpus, the examples and the compat fixtures,
# so those are inputs too: a change there must invalidate the cached result.
tasks:
  test:
    description: 'Vitest suite of this package'
    command: 'vitest run --config $workspaceRoot/vitest.config.ts'
    # Every package reaches @weft/core, which loads the generated WebAssembly module, or the native
    # addon when one is built (WEFT_ENGINE=auto). The addon is a dependency of every suite for two
    # reasons: it is built before any suite starts, and moon puts a dependency's hash (here the
    # addon's crate closure) into the dependent's hash, so a change to the addon re-runs them all.
    deps: ['root:wasm', 'root:native']
    # Generated files are no inputs, or the first run would change the hash of the second:
    # - node_modules: Vitest writes its results cache to node_modules/.vite on every run. A dependency
    #   change still reaches the hash through the lockfile.
    # - packages/core/native: the addon is a task dependency (above), so its hash reaches the suites
    #   through `deps`; hashing the files as well would also make the first run's suites hash an
    #   addon that did not exist when they were hashed.
    # - packages/visual/diffs: the images the visual suite writes when a screenshot differs.
    inputs:
      - '**/*'
      - '!**/node_modules/**'
      - '!native/**'
      - '!diffs/**'
      - '/packages/**/*'
      - '!/packages/**/node_modules/**'
      - '!/packages/core/native/**'
      - '!/packages/visual/diffs/**'
      - '/pnpm-lock.yaml'
      - '/corpus/**/*'
      - '/examples/**/*'
      - '/schemas/**/*'
      - '/compat/**/*'
      - '/SPEC.md'
      - '/AGENT-SPEC.md'
      - '/vitest.config.ts'
      - '/crates/*/tests/fixtures/**/*'
