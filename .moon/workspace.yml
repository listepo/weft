# moon runs the workspace tasks with caching; pnpm still owns dependencies and mise owns tools.
projects:
  - 'packages/*'
  - 'plugins/*'
  - 'bench'
  - 'tooling'
  - 'moon.yml'

# Matches the moon pin in mise.toml.
versionConstraint: '>=2.5.6'

telemetry: false

vcs:
  client: 'git'
  defaultBranch: 'main'
