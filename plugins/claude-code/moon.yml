# The plugin's tests read the marketplace manifest at the repository root.
tasks:
  test:
    inputs:
      - '/.claude-plugin/**/*'
  # Regenerates the committed dist/ and skills/spec/AGENT-SPEC.md. dist/ carries the WebAssembly
  # core, so it is built after root:wasm. Uncached: the outputs are committed files.
  build:
    command: 'node build.ts'
    deps: ['root:wasm']
    inputs:
      - '/packages/*/src/**/*'
      - 'scripts/**/*'
      - 'build.ts'
      - '/AGENT-SPEC.md'
      - '/packages/catalog/tokens/**/*'
    options:
      cache: false
      runInCI: false
