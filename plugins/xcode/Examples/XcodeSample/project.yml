# An Xcode project (generate it with `xcodegen`; the .xcodeproj is not committed) whose app target
# runs the Weft build tool plugin: `Sources/login.weft` and `Sources/review.weft` are turned into
# SwiftUI on every build, with one `WeftTokens.swift` for both.
name: XcodeSample
options:
  bundleIdPrefix: dev.weft.sample
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
packages:
  WeftXcode:
    path: ../..
targets:
  XcodeSample:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [Sources]
    buildToolPlugins:
      - plugin: WeftBuildTool
        package: WeftXcode
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '6.0'
        CODE_SIGNING_ALLOWED: NO
