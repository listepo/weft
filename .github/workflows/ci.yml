# The documented merge gate (README.md: "a change merges only after it exits 0"),
# run on every pull request and push to main. mise installs the pinned toolchain
# (moon, the Rust toolchain with wasm32, deno, bun); pnpm owns the dependencies;
# moon runs the tasks with its own caching. The browser leg of root:runtimes
# needs the Playwright Chromium, installed once per run until moon learns to.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    # macOS, the environment the committed artifacts (the plugins' wasm-web
    # bundles) are built on: a linux runner builds byte-different wasm, and the
    # bundle test compares bytes. Xcode 27 through pyrlyn/ci's setup-xcode —
    # the same pin every pyrlyn repo runs, so the build-tool plugin's verbose
    # output behaves as it does in development (Xcode 26.x hides it).
    runs-on: xcode-27
    steps:
      # Full history: moon's change detection diffs against the merge base and
      # a shallow checkout makes that fail (git exits 128 on the missing base).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      # The workflow lint the pre-push hook (hk.pkl) runs; mise.toml pins jactionlint and shellcheck.
      - run: jactionlint --color
      - uses: pyrlyn/ci/.github/actions/setup-xcode@87cca51e2e995af39b78e6938bc89a82a844f4e2
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      # The gate in three steps, which together run exactly the documented
      # command. On the runner's few cores the heavy legs starved each other when
      # moon ran them all at once: the runtime legs and the glass screen in the
      # Chromium suite passed their timeouts while the Swift typechecks of the
      # Rust tests and the simulator build ran beside them. Each later step takes
      # the module and the addon from moon's cache of the first.
      - name: The merge gate, Rust and static checks
        run: moon run root:rust-test root:rust-lint root:typecheck root:lint
      - name: The merge gate, package tests
        env:
          # The runner is darwin-arm64 but is not the machine the reviewed
          # baselines were taken on; naming itself skips exactly those
          # comparisons and keeps everything else (live-vs-live, a11y) running.
          WEFT_BASELINE_PLATFORM: github-runner
        run: moon run :test
      - name: The merge gate, runtime legs
        run: moon run root:runtimes

  # Publishes plugins/penpot/dist under /penpot/ on GitHub Pages, the only URL a Penpot plugin
  # installs from (its manifest.json). Runs after the gate and only on a push to main: a pull
  # request never deploys, so this is not a second merge gate. The creator sets the repository's
  # Pages source to "GitHub Actions" once; until then deploy-pages fails and the site stays off.
  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One deploy at a time, and never cancel a deploy halfway: the next push queues behind it.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: pnpm install --frozen-lockfile
      # root:wasm first (the build depends on it): the UI inlines the module's bytes. The build
      # keeps runInCI: false so `moon ci` does not rebuild dist/ on every full check, and moon
      # drops such a task from `moon run` in CI even by name; exec can be told to keep it.
      - run: moon exec penpot-plugin:build --ignore-ci-checks
      # Pages serves an uploaded artifact at the site root, and the install URL keeps the
      # penpot/ subpath so the rest of the site is free later. Only dist/ is published.
      - name: Stage dist/ under penpot/
        run: |
          mkdir -p site/penpot
          cp -R plugins/penpot/dist/. site/penpot/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      # Penpot fetches these cross-origin from its own site, so each one must come back 200,
      # with a content type its loader accepts and Access-Control-Allow-Origin: *. The retries
      # cover the CDN catching up to the deployment deploy-pages just finished.
      - name: Check the published plugin
        run: |
          set -euo pipefail
          base="https://listepo.github.io/weft/penpot"
          check() {
            file=$1
            type_re=$2
            url="$base/$file"
            status=""
            type=""
            cors=""
            for _ in 1 2 3 4 5; do
              headers=$(curl -sS -D - -o /dev/null "$url" || true)
              status=$(printf '%s\n' "$headers" | awk 'NR==1 {print $2}' | tr -d '\r')
              type=$(printf '%s\n' "$headers" | awk -F': ' 'tolower($1)=="content-type" {print $2}' | tr -d '\r')
              cors=$(printf '%s\n' "$headers" | awk -F': ' 'tolower($1)=="access-control-allow-origin" {print $2}' | tr -d '\r')
              if [ "$status" = "200" ] && printf '%s\n' "$type" | grep -Eq "$type_re" && [ "$cors" = "*" ]; then
                echo "ok $file ($type)"
                return 0
              fi
              sleep 3
            done
            echo "::error::$url served status=$status content-type=$type access-control-allow-origin=$cors"
            return 1
          }
          check manifest.json '^application/json'
          check plugin.js '^(application|text)/javascript'
          check ui.html '^text/html'
