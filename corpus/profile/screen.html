<main aria-label="Profile">
  <img alt="Profile photo" data-bind="src:$.user.avatar">
  <h1 data-bind="text:$.user.name"></h1>
  <p data-bind="text:$.user.bio"></p>
  <h2>Links</h2>
  <div class="row gap-md">
    <a data-bind="href:$.user.website">Website</a>
    <a data-bind="href:$.user.github">GitHub</a>
  </div>
  <button type="button" data-action="press:profile.edit">Edit profile</button>
</main>
