<main aria-label="Settings">
  <h1>Settings</h1>
  <section aria-label="Notifications">
    <h2>Notifications</h2>
    <label>
      <input type="checkbox" role="switch" data-bind="checked:$.emailAlerts">
      <span>Email alerts</span>
    </label>
    <label>
      <input type="checkbox" role="switch" data-bind="checked:$.pushAlerts">
      <span>Push notifications</span>
    </label>
  </section>
  <section aria-label="Appearance">
    <h2>Appearance</h2>
    <label for="language">Language</label>
    <select id="language" data-bind="value:$.language">
      <option value="en">English</option>
      <option value="de">Deutsch</option>
      <option value="fr">Français</option>
    </select>
    <label>
      <input type="checkbox" role="switch" data-bind="checked:$.darkMode">
      <span>Dark mode</span>
    </label>
  </section>
  <button type="button" data-variant="primary" data-bind="disabled:!$.dirty" data-action="press:settings.save">Save changes</button>
</main>
