<main aria-label="Sign in">
  <form data-state="idle" data-action="submit:auth.submit">
    <h1>Sign in</h1>
    <div class="stack gap-md">
      <label for="email">Email</label>
      <input id="email" type="email" required data-bind="value:$.email">
      <label for="password">Password</label>
      <input id="password" type="password" required data-bind="value:$.password">
    </div>
    <button type="submit" data-variant="primary" data-bind="disabled:!$.email">Sign in</button>
    <footer>
      <a href="#" data-action="press:nav.reset">Forgot password?</a>
      <a href="#" data-action="press:nav.signup">Create an account</a>
    </footer>
  </form>
</main>
