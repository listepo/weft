# What tests/bindings.rs generates include/weft_studio.h with (`WEFT_STUDIO_BLESS=1`).
language = "C"
include_guard = "WEFT_STUDIO_H"
autogen_warning = "/* Generated by cbindgen from crates/weft-studio-ffi: WEFT_STUDIO_BLESS=1 cargo test -p weft-studio-ffi --test bindings. Do not edit. */"
# The surface type is slint-bindings' own; its header defines it, this one only names it.
after_includes = "\ntypedef struct SbHost SbHost;"
cpp_compat = true
documentation = true
documentation_style = "c99"
style = "both"
usize_is_size_t = true

[export]
prefix = ""
