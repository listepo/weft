[package]
name = "weft-binding"
description = "The JSON-text functions behind the WebAssembly module and the native addon of @weft/core and @weft/catalog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
indexmap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
weft-catalog = { workspace = true }
weft-core = { workspace = true }
weft-import = { workspace = true, optional = true }
weft-web = { workspace = true, optional = true }

[features]
# The core plus the web importers and generators (`@weft/core/web`).
web = ["dep:weft-import", "dep:weft-web"]

[lints]
workspace = true
