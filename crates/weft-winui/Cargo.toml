[package]
name = "weft-winui"
description = "WinUI 3 (Windows App SDK) page generator and XAML importer for Weft documents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# `read_winui`: hand-written or edited XAML, read element by element. No extra dependency; the
# feature keeps the reader's tables out of builds that only generate, as in weft-slint.
import = []

[dependencies]
indexmap = { workspace = true }
roxmltree = { workspace = true }
thiserror = { workspace = true }
weft-catalog = { workspace = true }
weft-core = { workspace = true }
weft-import = { workspace = true }

[[test]]
name = "read"
required-features = ["import"]

[lints]
workspace = true
